<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waypoint</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Waypoint</h1>
    <p id="status">Loading map…</p>
  </header>
  <form id="place-form" hidden>
    <input id="place" type="search" placeholder="City or address" aria-label="City or address" autocomplete="street-address">
    <button type="submit">Search</button>
    <button type="button" id="use-default">Midtown</button>
  </form>
  <div id="map" aria-label="Map of nearby restrooms"></div>
  <main>
    <ul id="results"></ul>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
